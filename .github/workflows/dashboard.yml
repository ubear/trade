name: 仪表盘自动部署
on:
  schedule:
    - cron: '30 7 * * 1-5'  # 北京时间 15:30 (收盘后)
  workflow_dispatch:
  push:
    paths: ['holdings.json', 'dashboard.html', 'portfolio_dashboard.py']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 采集数据
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python3 portfolio_dashboard.py
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
