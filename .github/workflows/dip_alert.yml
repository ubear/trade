name: 大跌监控推送
on:
  schedule:
    # 北京时间 14:50 = UTC 06:50, 周一至周五
    - cron: '50 6 * * 1-5'
  workflow_dispatch:  # 手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行监控
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TZ: Asia/Shanghai
        run: python3 dip_monitor.py
